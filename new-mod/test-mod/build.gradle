plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    bundledMods
}

configurations {
    implementation.extendsFrom bundledMods
}

dependencies {
    bundledMods "maven.modrinth:create:${project.create_modrinth_version}"
    bundledMods "maven.modrinth:create-jetpack:${project.create_jetpack_modrinth_version}"
    implementation fileTree(dir: layout.buildDirectory.dir('embedded-libraries'), include: '*.jar')
}

tasks.register('extractEmbeddedLibraries', Copy) {
    from {
        configurations.bundledMods.collect { archive ->
            zipTree(archive).matching { include 'META-INF/jarjar/*.jar' }
        }
    }
    eachFile { path = name }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('embedded-libraries')
}

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('extractEmbeddedLibraries')
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'    : project.mod_id,
            'Specification-Vendor'   : project.mod_authors,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.version,
            'Implementation-Vendor'  : project.mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
